name: PHPUnit Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install PHP 8.4
        run: |
          sudo add-apt-repository ppa:ondrej/php -y
          sudo apt-get update
          sudo apt-get install php8.4-cli php8.4-xml php8.4-mbstring php8.4-curl -y

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit
        run: composer test